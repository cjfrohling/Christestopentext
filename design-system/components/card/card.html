<!-- ============================================================
   CARD COMPONENT
   Variants: default | promo (dark)
   ============================================================ -->

<!-- Default card -->
<div class="card">
  <div class="card__icon">
    <svg width="18" height="18" stroke="currentColor" fill="none" viewBox="0 0 24 24" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
    </svg>
  </div>
  <h3 class="card__heading">Card title</h3>
  <p class="card__body">Supporting description text that provides additional context about this card's content.</p>
</div>

<!-- Promo card (dark, used in mega panels) -->
<div class="card card--promo">
  <span class="badge badge--inverse">Featured</span>
  <h4 class="card__heading">The Agentic AI Genome</h4>
  <p class="card__body">Discover how AI agents transform enterprise information into a strategic advantage.</p>
  <a class="card__cta" href="#">Read the report →</a>
</div>
