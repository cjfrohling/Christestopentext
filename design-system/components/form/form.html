<!-- ============================================================
   FORM COMPONENTS
   Elements: text input | search | label | search overlay
   ============================================================ -->

<!-- Text input with label -->
<div class="field">
  <label class="field__label" for="example-input">Label</label>
  <div class="field__wrap">
    <input class="field__input" type="text" id="example-input" placeholder="Enter value…">
  </div>
</div>

<!-- Search field -->
<div class="field">
  <label class="field__label" for="search">Search OpenText</label>
  <div class="field__wrap field__wrap--search">
    <input class="field__input" type="search" id="search" placeholder="Search products, solutions, resources…" autocomplete="off">
    <button class="field__submit" aria-label="Submit search">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
    </button>
  </div>
</div>
